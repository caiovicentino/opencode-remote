name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # P2-130: tag and the two package.json versions must agree BEFORE anything
      # is published — a drifting version produces a latest-mac.yml whose
      # `version` field does not match the app binary, breaking electron-updater
      # for every installed copy. Fails before `gh release create`.
      - name: Release preflight (tag ↔ package.json versions)
        run: npx --yes tsx@4.23.12 scripts/release-preflight.ts "$GITHUB_REF_NAME"

      - name: Build source tarball (node_modules excluded)
        run: |
          VERSION=${GITHUB_REF_NAME}
          git archive --format=tar.gz --prefix="opencode-remote-${VERSION}/" -o "opencode-remote-${VERSION}.tar.gz" "$GITHUB_REF_NAME"

      # P2-179: the release is born a DRAFT — nothing is visible to the
      # installed base while the packaging jobs below are still running.
      # Attaching assets to a draft works the same, so the desktop-dmg and
      # desktop-win uploads are unchanged; the draft only goes public in the
      # release-publish job after every verification passed.
      - name: Create GitHub release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" opencode-remote-*.tar.gz --draft --generate-notes --title "$GITHUB_REF_NAME"

  # P2-098: third-party installability — a release ships a real macOS installer
  # (DMG), not just the source tarball. P2-136: a signing preflight decides the
  # mode before packaging — with a usable Developer ID certificate (CSC_LINK/
  # CSC_NAME) plus the Apple notarization secrets the DMG is signed with
  # hardened runtime and notarized; without them the build stays ad-hoc signed
  # and users right-click → Open once (README), exactly as before.
  desktop-dmg:
    runs-on: macos-14
    needs: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # P2-136: pure env inspection, always exits 0 — problems are reported as
      # ::warning:: annotations and the outputs below keep the job green.
      - name: Signing preflight (Developer ID or ad-hoc)
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_IDENTITY_AUTO_DISCOVERY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node apps/desktop/scripts/signing-profile.mjs

      - name: Build + package DMG (notarized when the signing profile allows)
        env:
          # No signing identity in CI by default — ad-hoc signing
          # (right-click → Open). Discovery is only flipped on when the
          # preflight proved a usable Developer ID identity: with
          # CSC_IDENTITY_AUTO_DISCOVERY=false electron-builder skips identity
          # lookup entirely and would silently ignore the certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.mode == 'developer-id' && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          NOTARIZE=""
          if [ "${{ steps.signing.outputs.notarize }}" = "true" ]; then
            NOTARIZE="-c.mac.notarize=true"
          else
            echo "Signing profile: ${{ steps.signing.outputs.mode }} (notarize=no) — shipping ad-hoc signed DMG (skip notarization)"
          fi
          npm run dist --workspace @ocr/desktop -- $NOTARIZE

      # P2-130: a broken bundle (e.g. web-dist/index.html missing → DMG that
      # opens blank) must block the upload instead of shipping to users.
      - name: Smoke-check the packaged bundle
        run: npm run dist:smoke --workspace @ocr/desktop

      # P2-204: dist-smoke only INSPECTS the package; a regression that only
      # shows up at runtime — main throwing at boot, an asar missing an asset
      # the renderer asks for, an entitlement killing the process — used to
      # sail past the packaging jobs and surface on the user's Mac. Boot the
      # real .app hermetically (temp userData, no sidecar, hidden window),
      # fail BEFORE the upload below — same shape as the P2-196 relay image
      # smoke. Playwright missing fails closed (exit 1). shell: bash
      # (P2-126 lesson).
      - name: Smoke-boot the packaged app
        timeout-minutes: 10
        shell: bash
        run: |
          ARCH_DIR="$(uname -m | sed 's/x86_64/x64/')"
          APP="$(find apps/desktop/dist -maxdepth 3 -type d -name '*.app' | grep -F "$ARCH_DIR" | head -1)"
          [ -n "$APP" ] || APP="$(find apps/desktop/dist -maxdepth 3 -type d -name '*.app' | head -1)"
          [ -n "$APP" ] || { echo "packaged-boot: no .app under apps/desktop/dist — nothing to boot"; exit 1; }
          echo "packaged-boot: booting $APP"
          node apps/desktop/scripts/packaged-boot.mjs "$APP"

      # P2-251: the boot smoke above deliberately never spawns the sidecar
      # (OCR_DAEMON_ENTRY points nowhere), so the daemon bundle that
      # bundle-daemon.mjs builds used to reach the release without ever
      # executing. Run the packaged resources/daemon/index.js the way
      # daemon.ts runs it in production (packaged Electron as the Node
      # runtime), hermetically (temp HOME, relay off, ephemeral metrics
      # port) and require an authenticated /api/health 2xx BEFORE the upload
      # below. Proves the sidecar boots and serves on the packaged runtime;
      # does NOT prove the desktop shell reaches it end to end. Fail closed
      # with every problem listed. shell: bash (P2-126 lesson) and its own
      # timeout (P2-245 lesson).
      - name: Smoke the packaged daemon sidecar
        timeout-minutes: 5
        shell: bash
        run: |
          ARCH_DIR="$(uname -m | sed 's/x86_64/x64/')"
          APP="$(find apps/desktop/dist -maxdepth 3 -type d -name '*.app' | grep -F "$ARCH_DIR" | head -1)"
          [ -n "$APP" ] || APP="$(find apps/desktop/dist -maxdepth 3 -type d -name '*.app' | head -1)"
          [ -n "$APP" ] || { echo "packaged-daemon-smoke: no .app under apps/desktop/dist — nothing to boot"; exit 1; }
          node apps/desktop/scripts/packaged-daemon-smoke.mjs "$APP"

      # P2-170: a DMG whose notarization ticket never got stapled, whose
      # identity expired, or whose profile silently fell back to ad-hoc used
      # to be published as if signed — users opened it and got "app is
      # damaged" with no signal in CI. Run the three Gatekeeper verdicts on
      # the packaged app and fail the job BEFORE the upload below. The ad-hoc
      # no-secrets path stays green: spctl rejecting an ad-hoc build and a
      # missing staple without notarization are the documented right-click →
      # Open flow (scripts/gatekeeper-verify.ts decides).
      - name: Gatekeeper verification of the packaged app
        shell: bash
        run: |
          APP="$(find apps/desktop/dist -maxdepth 3 -type d -name '*.app' | head -1)"
          [ -n "$APP" ] || { echo "gatekeeper-verify: no .app found under apps/desktop/dist — nothing to verify"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP" > codesign.txt 2>&1 || true
          spctl -a -vv -t exec "$APP" > spctl.txt 2>&1 || true
          xcrun stapler validate "$APP" > stapler.txt 2>&1 || true
          npx --yes tsx@4.23.12 scripts/gatekeeper-verify.ts \
            "${{ steps.signing.outputs.mode }}" "${{ steps.signing.outputs.notarize }}" \
            codesign.txt spctl.txt stapler.txt

      # P2-146: build the Squirrel.Mac JSON feed from the packed dist root —
      # the zip the mac target now produces + latest-mac.yml become the
      # update-mac.json the packaged shell auto-consumes on darwin. Exits 1
      # (all problems listed) when the zip is missing or the yml version
      # drifted from the tag, blocking the upload below.
      - name: Build the Squirrel.Mac JSON feed
        run: node apps/desktop/scripts/update-feed.mjs

      # P2-126 lesson: shell: bash so the dist/*.dmg glob expands (pwsh would
      # pass it through verbatim).
      # P2-191: update-mac*.json covers all three feed files the mac side
      # writes — update-mac-arm64.json, update-mac-x64.json and the legacy
      # update-mac.json alias — so release-verify's per-arch feed slots are
      # satisfiable.
      - name: Attach DMG + update metadata to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            apps/desktop/dist/*.dmg apps/desktop/dist/latest-mac.yml apps/desktop/dist/update-mac*.json \
            --clobber

  # P2-126: stage 5 is half Windows — the release also ships the NSIS setup
  # exe plus the latest.yml metadata the in-app update check falls back to.
  # P2-159: Windows signing has its own profile (WIN_CSC_* secrets), resolved
  # by a preflight before packaging — the job never references the Apple
  # CSC_LINK/CSC_KEY_PASSWORD pair the mac job consumes, so the installer can
  # not be signed with (or clobbered by) a Developer ID certificate. Without
  # WIN_CSC_* secrets the build ships unsigned (one-time SmartScreen warning,
  # README); a half-configured profile aborts the job (fail-closed preflight).
  # shell: bash on every run step so globs expand (pwsh won't).
  desktop-win:
    runs-on: windows-latest
    needs: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # P2-159: pure env inspection — exits 0 writing mode=authenticode|
      # unsigned, or exits 1 (job aborts) listing ALL fail-closed problems
      # when the WIN_CSC_* secrets are half-configured or blank.
      - name: Signing preflight (Authenticode or unsigned)
        id: win-signing
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_SUBJECT_NAME: ${{ secrets.WIN_CSC_SUBJECT_NAME }}
        shell: bash
        run: node apps/desktop/scripts/signing-profile-win.mjs

      - name: Build + package NSIS installer (signed when WIN_CSC_* secrets exist)
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_SUBJECT_NAME: ${{ secrets.WIN_CSC_SUBJECT_NAME }}
        shell: bash
        run: |
          if [ "${{ steps.win-signing.outputs.mode }}" = "unsigned" ]; then
            echo "Signing profile: unsigned — shipping unsigned installer (SmartScreen warning, README)"
          fi
          if [ -n "$WIN_CSC_SUBJECT_NAME" ]; then
            npm run dist --workspace @ocr/desktop -- -c.win.signtoolOptions.certificateSubjectName="$WIN_CSC_SUBJECT_NAME"
          else
            npm run dist --workspace @ocr/desktop
          fi

      # P2-164: same gate P2-130 put on the mac side — a broken bundle (missing
      # web-dist/index.html or daemon/index.js) must abort the job BEFORE the
      # setup exe + latest.yml reach Windows users as a blank-opening app.
      # shell: bash (P2-126 lesson): pwsh does not expand globs.
      - name: Smoke-check the packaged bundle
        shell: bash
        run: npm run dist:smoke --workspace @ocr/desktop

      # P2-183: the preflight deciding mode=authenticode proves INTENT to sign,
      # not that the packaged exe actually carries a valid signature — an
      # expired certificate, a wrong password signtool silently accepted or a
      # signing step that never ran used to publish an installer whose first
      # launch shows the SmartScreen wall, with no signal in CI. Verify the
      # Authenticode verdict on the packaged setup exe and abort BEFORE the
      # upload below. mode=unsigned stays green: that is the documented
      # no-secrets release path (same as ad-hoc on the mac side).
      # shell: bash (P2-126 lesson): pwsh does not expand globs.
      - name: Authenticode verification of the packaged installer
        shell: bash
        run: |
          EXE="$(find apps/desktop/dist -maxdepth 1 -type f -name '*.exe' | head -1)"
          [ -n "$EXE" ] || { echo "authenticode-verify: no setup exe found under apps/desktop/dist — nothing to verify"; exit 1; }
          cat > authenticode-check.ps1 <<'PS1'
          $s = Get-AuthenticodeSignature -FilePath $args[0]
          Write-Output "Status: $($s.Status)"
          Write-Output "Subject: $($s.SignerCertificate.Subject)"
          Write-Output "StatusMessage: $($s.StatusMessage)"
          PS1
          powershell -NoProfile -ExecutionPolicy Bypass -File authenticode-check.ps1 "$EXE" > authenticode.txt 2>&1 || true
          npx --yes tsx@4.23.12 scripts/authenticode-verify.ts \
            "${{ steps.win-signing.outputs.mode }}" authenticode.txt

      # P2-208: dist-smoke only INSPECTS the package and Authenticode only
      # reads the signature — a regression that only shows up at runtime (asar
      # missing an asset the renderer asks for, main throwing at boot, the
      # process dying in the first second) used to sail past this job and
      # surface on the stage-5 user's machine through the installer. Boot the
      # real packaged exe hermetically (temp userData, no sidecar, hidden
      # window) and fail BEFORE the upload below — same shape as the P2-204
      # mac boot smoke. Playwright missing fails closed (exit 1). shell: bash
      # (P2-126/P2-164 lessons): pwsh does not expand globs.
      - name: Smoke-boot the packaged app
        timeout-minutes: 10
        shell: bash
        run: |
          DIR="$(find apps/desktop/dist -maxdepth 2 -type d -name 'win-unpacked' | head -1)"
          [ -n "$DIR" ] || { echo "packaged-boot: no win-unpacked dir under apps/desktop/dist — nothing to boot"; exit 1; }
          echo "packaged-boot: booting $DIR"
          node apps/desktop/scripts/packaged-boot.mjs "$DIR"

      # P2-251: same daemon-sidecar smoke the mac job runs — the boot smoke
      # above never spawns the sidecar, so the packaged resources/daemon/
      # index.js must prove it boots and serves /api/health on the packaged
      # Electron-as-Node runtime BEFORE the upload below. Hermetic (temp
      # HOME, relay off, ephemeral port), fail closed. shell: bash (P2-126
      # lesson) and its own timeout (P2-245 lesson).
      - name: Smoke the packaged daemon sidecar
        timeout-minutes: 5
        shell: bash
        run: |
          DIR="$(find apps/desktop/dist -maxdepth 2 -type d -name 'win-unpacked' | head -1)"
          [ -n "$DIR" ] || { echo "packaged-daemon-smoke: no win-unpacked dir under apps/desktop/dist — nothing to boot"; exit 1; }
          node apps/desktop/scripts/packaged-daemon-smoke.mjs "$DIR"

      - name: Attach setup exe + update metadata to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            apps/desktop/dist/*.exe apps/desktop/dist/latest.yml \
            --clobber

  # P2-153: a release is only "complete" when every platform's artifacts are
  # actually attached — until now nothing looked at the final result, so a
  # Windows job dying mid-upload left the release public with only a DMG and
  # the P2-131 per-platform update feed answering 404. This final job reads the
  # published asset names from the release and fails (exit 1, all missing
  # labels at once) unless the full expected set is there. Deliberately NOT
  # needing relay-image: its publication is opt-in fail-closed and produces no
  # download asset. P2-126 lesson: shell: bash on every run step.
  release-verify:
    runs-on: ubuntu-latest
    needs: [desktop-dmg, desktop-win]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify the published release carries every platform asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' \
            | npx --yes tsx@4.23.12 scripts/release-assets.ts "$GITHUB_REF_NAME"

  # P2-151: the relay image is built in CI on every release tag instead of by
  # hand on the operator's host — a broken deploy/relay/Dockerfile fails here,
  # before anyone stakes a stage-4 deploy on it. Publishing is opt-in
  # fail-closed: the push step only runs when the repository variable
  # PUBLISH_RELAY_IMAGE is exactly "true"; otherwise the job just proves the
  # image builds, so tagging never publishes anything by surprise. The image
  # carries no secrets and the relay stays a blind router — this job adds no
  # crypto surface.
  relay-image:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image references
        id: refs
        run: npx --yes tsx@4.23.12 scripts/relay-image.ts "$GITHUB_REF_NAME"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build image (both references)
        shell: bash
        run: |
          docker build -f deploy/relay/Dockerfile \
            -t "${{ steps.refs.outputs.version-ref }}" \
            -t "${{ steps.refs.outputs.latest-ref }}" .

      # P2-196: an image that compiles but does not boot — a CMD pointing at a
      # dist the final stage never copied, a broken embedded RELAY_WEB_DIR, a
      # boot refused by the P2-188 fail-closed preflight — must never become
      # the image the stage-4 operator pulls. Boot the just-built image on an
      # ephemeral loopback port and run the probe battery against it BEFORE
      # any push; the container is removed no matter how the step ends.
      # Wait ceiling: 30 attempts × 1s for /healthz (image boot + start-up),
      # then the smoke CLI itself (5s fetch timeout per probe, documented in
      # docs/RELAY-HOSTING.md). shell: bash (P2-126 lesson).
      - name: Smoke the built image (boot + probes) before any push
        shell: bash
        run: |
          set -euo pipefail
          PORT=$(( (RANDOM % 20000) + 30000 ))
          docker run -d --name relay-smoke \
            -p "127.0.0.1:${PORT}:8787" \
            "${{ steps.refs.outputs.version-ref }}"
          trap 'docker rm -f relay-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORT}/healthz" >/dev/null 2>&1; then
              break
            fi
            if [ "$i" = 30 ]; then
              echo "relay-image-smoke: /healthz never answered after 30 attempts — the image does not boot"
              docker logs relay-smoke
              exit 1
            fi
            sleep 1
          done
          CONTAINER_USER="$(docker exec relay-smoke whoami)"
          npx --yes tsx@4.23.12 scripts/relay-image-smoke.ts "http://127.0.0.1:${PORT}" "$CONTAINER_USER"

      - name: Push both references (opt-in: PUBLISH_RELAY_IMAGE=true)
        if: vars.PUBLISH_RELAY_IMAGE == 'true'
        shell: bash
        run: |
          docker push "${{ steps.refs.outputs.version-ref }}"
          docker push "${{ steps.refs.outputs.latest-ref }}"

  # P2-157: P2-153 only proves the feed FILES are attached — an update-mac.json
  # whose url points at another version's zip, or a latest.yml whose path names
  # an installer that was never uploaded, used to ship green and then break
  # auto-update (P2-146/P2-131) for every installed app with no signal. This
  # job downloads both feeds and checks their contents against the tag and the
  # published asset names. P2-212: the per-architecture feeds
  # (update-mac-arm64.json / update-mac-x64.json) are the ones real machines
  # consult since P2-191, so they are downloaded and content-checked too —
  # each must point at a published zip carrying its own architecture, and the
  # legacy update-mac.json alias must stay identical to the arm64 document.
  # P2-126 lesson: shell: bash on every run step.
  release-feeds:
    runs-on: ubuntu-latest
    needs: [desktop-dmg, desktop-win]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify the update feeds point at this release's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p feeds
          gh release download "$GITHUB_REF_NAME" \
            --pattern update-mac.json --pattern latest.yml \
            --pattern update-mac-arm64.json --pattern update-mac-x64.json \
            --dir feeds
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' \
            | npx --yes tsx@4.23.12 scripts/feed-consistency.ts "$GITHUB_REF_NAME" \
                feeds/update-mac.json feeds/latest.yml \
                feeds/update-mac-arm64.json feeds/update-mac-x64.json

  # P2-179: the draft only goes public here, after release-verify AND
  # release-feeds passed. scripts/release-publish.ts reads the draft flag +
  # asset list from `gh release view` and refuses (exit 1, every problem at
  # once) unless the draft carries every required asset — a release without
  # installers now ends the run as a draft, never as a broken public download.
  # Already-published releases are an idempotent no-op (publish=false, zero
  # problems), so a re-run walks straight past this job. The Homebrew formula
  # pin moved here from the release job (P2-098) so main never points at a
  # release that is not public yet: the sha256 is computed from the tarball
  # downloaded back from the (now public) release, not from the local build
  # file. Fail-open as before: a refused push only warns, it never fails the
  # release. P2-126 lesson: shell: bash on every run step.
  release-publish:
    runs-on: ubuntu-latest
    needs: [release-verify, release-feeds]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # P2-186: make every download verifiable. The job downloads the release's
      # own assets back, hashes each file with node (sha256), builds the
      # canonical coreutils-format manifest via the CLI and attaches it to the
      # DRAFT — so the manifest can only ever describe the bytes that were
      # actually published. This runs BEFORE the publish step below on
      # purpose: a failure here (bad hash shape, unexpected name, missing
      # asset) leaves the release a draft under the P2-179 contract instead of
      # going public with unverifiable downloads. The skip-list keeps a re-run
      # idempotent (a previously uploaded manifest is downloaded again but
      # never hashed into itself). shell: bash (P2-126 lesson): pwsh does not
      # expand globs.
      - name: Attach the SHA-256 checksum manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p checksums
          gh release download "$GITHUB_REF_NAME" --dir checksums
          node -e '
            const { readdirSync, statSync, readFileSync, writeFileSync } = require("node:fs");
            const { createHash } = require("node:crypto");
            const { join } = require("node:path");
            const SKIP = new Set(["checksums.txt", "entries.json"]);
            const entries = [];
            for (const name of readdirSync("checksums").sort()) {
              const path = join("checksums", name);
              if (!statSync(path).isFile() || SKIP.has(name)) continue;
              entries.push({ name, hash: createHash("sha256").update(readFileSync(path)).digest("hex") });
            }
            writeFileSync("entries.json", JSON.stringify(entries));
          '
          npx --yes tsx@4.23.12 scripts/release-checksums.ts "$GITHUB_REF_NAME" entries.json checksums.txt
          gh release upload "$GITHUB_REF_NAME" checksums.txt --clobber

      # P2-245: Windows gets the same reproducible install path the Homebrew
      # formula gives the Mac. This step builds the three winget manifests of
      # the documented caiovicentino.opencode-remote package from the tag and
      # the sha256 already hashed into checksums.txt above, verifies them
      # against the release facts (scripts/wingetmanifest.ts — pure: declared
      # version, installer URL, hash and package id) and attaches them as
      # assets. Any problem fails the job and the release stays a draft under
      # the P2-179 contract. Nothing is committed by CI, nothing is pushed to
      # any Microsoft manifest repository, and no credential beyond the job's
      # github.token is read. shell: bash (P2-126/P2-164 lessons): the step
      # writes a throwaway driver and handles asset names with spaces
      # verbatim.
      - name: Attach the winget manifests to the release
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 5
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > winget-assets.txt
          cat > winget-driver.mts <<'DRIVER'
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import {
            buildWingetManifests,
            wingetProblems,
            WINGET_PACKAGE_ID,
            WINGET_RELEASES_BASE,
          } from "./scripts/wingetmanifest";

          const tag = process.argv[2] ?? "";
          const assets = readFileSync("winget-assets.txt", "utf8")
            .split(/\r?\n/)
            .map((line) => line.trim())
            .filter(Boolean);
          const checksums = readFileSync("checksums.txt", "utf8");
          const version = tag.startsWith("v") ? tag.slice(1) : tag;
          const setup = assets.find((name) => name.endsWith(".exe") && name.includes(version));
          if (!setup) {
            console.error(`winget: no Windows setup exe for ${version} in the published asset list`);
            process.exit(1);
          }
          const line = checksums.split(/\r?\n/).find((l) => l.endsWith(`  ${setup}`));
          if (!line) {
            console.error(`winget: checksums.txt carries no sha256 line for ${setup}`);
            process.exit(1);
          }
          const sha = line.split("  ")[0] ?? "";
          const url = `${WINGET_RELEASES_BASE}${tag}/${encodeURIComponent(setup)}`;
          const manifests = buildWingetManifests(WINGET_PACKAGE_ID, version, url, sha);
          mkdirSync("winget", { recursive: true });
          for (const doc of manifests) writeFileSync(join("winget", doc.fileName), doc.text, "utf8");
          const problems = wingetProblems(manifests, tag, assets, checksums);
          if (problems.length > 0) {
            for (const problem of problems) console.error(`  - ${problem}`);
            console.error(`winget: ${problems.length} problem(s) found — the release stays a draft`);
            process.exit(1);
          }
          console.log(`winget: OK ${tag} — ${manifests.length} manifest(s) verified against the published assets`);
          DRIVER
          npx --yes tsx@4.23.12 winget-driver.mts "$GITHUB_REF_NAME"
          rm -f winget-driver.mts winget-assets.txt
          gh release upload "$GITHUB_REF_NAME" winget/*.yaml --clobber

      # P2-255: the Mac gets the same package-manager install path winget gave
      # Windows. This step builds the Homebrew cask of the documented
      # opencode-remote token from the tag and the two per-arch DMG assets,
      # with the sha256 each one carries in checksums.txt above, verifies the
      # cask against the release facts (scripts/caskmanifest.ts — pure:
      # declared version, both DMG addresses, both hashes, both download
      # targets) and attaches the cask file as a release asset, so a Mac user
      # can run `brew install --cask ./opencode-remote-cask.rb` instead of
      # dragging a DMG by hand. Any problem fails the job and the release
      # stays a draft under the P2-179 contract. Nothing is committed by CI,
      # no tap and no third-party repository is touched, and no credential
      # beyond the job's github.token is read. shell: bash (P2-126/P2-164
      # lessons) and its own timeout (P2-245 lesson).
      - name: Attach the Homebrew cask to the release
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 5
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > cask-assets.txt
          cat > cask-driver.mts <<'DRIVER'
          import { readFileSync, writeFileSync } from "node:fs";
          import {
            buildCaskManifest,
            caskProblems,
            CASK_RELEASES_BASE,
          } from "./scripts/caskmanifest";

          const tag = process.argv[2] ?? "";
          const assets = readFileSync("cask-assets.txt", "utf8")
            .split(/\r?\n/)
            .map((line) => line.trim())
            .filter(Boolean);
          const checksums = readFileSync("checksums.txt", "utf8");
          const version = tag.startsWith("v") ? tag.slice(1) : tag;
          const dmg = (arch: string): { name: string; sha: string } => {
            const name = assets.find((n) => n.endsWith(".dmg") && n.includes(version) && n.includes(arch));
            if (!name) {
              console.error(`cask: no macOS DMG carrying ${version} for ${arch} in the published asset list`);
              process.exit(1);
            }
            const line = checksums.split(/\r?\n/).find((l) => l.endsWith(`  ${name}`));
            if (!line) {
              console.error(`cask: checksums.txt carries no sha256 line for ${name}`);
              process.exit(1);
            }
            return { name, sha: line.split("  ")[0] ?? "" };
          };
          const arm = dmg("arm64");
          const intel = dmg("x64");
          const cask = buildCaskManifest(
            version,
            `${CASK_RELEASES_BASE}${tag}/${encodeURIComponent(arm.name)}`,
            `${CASK_RELEASES_BASE}${tag}/${encodeURIComponent(intel.name)}`,
            arm.sha,
            intel.sha,
          );
          writeFileSync(cask.fileName, cask.text, "utf8");
          const problems = caskProblems(cask, tag, assets, checksums);
          if (problems.length > 0) {
            for (const problem of problems) console.error(`  - ${problem}`);
            console.error(`cask: ${problems.length} problem(s) found — the release stays a draft`);
            process.exit(1);
          }
          console.log(`cask: OK ${tag} — ${cask.fileName} verified against the published assets`);
          DRIVER
          npx --yes tsx@4.23.12 cask-driver.mts "$GITHUB_REF_NAME"
          rm -f cask-driver.mts cask-assets.txt
          gh release upload "$GITHUB_REF_NAME" opencode-remote-cask.rb --clobber

      # P2-216: the auto-generated body is a wall of pilot commit titles — a
      # stage-5 user cannot tell which file fits their machine. This step
      # writes a short download guide into the DRAFT body
      # (scripts/release-notes.ts): one line per audience (Mac Apple Silicon,
      # Mac Intel, Windows) naming ONLY files taken from the actual asset
      # list, plus the first-open warning and the checksums.txt how-to. It
      # runs after the checksum manifest upload (the guide points at it) and
      # before the publish step: any problem fails the job and the release
      # stays a draft under the P2-179 contract instead of publishing wrong
      # guidance. shell: bash (P2-126/P2-164 lessons): the step handles asset
      # names verbatim, spaces included.
      - name: Write the download guide into the release body
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > guide-assets.txt
          gh release view "$GITHUB_REF_NAME" --json body --jq '.body' > guide-body.md
          npx --yes tsx@4.23.12 scripts/release-notes.ts "$GITHUB_REF_NAME" guide-assets.txt guide-body.md
          gh release edit "$GITHUB_REF_NAME" --notes-file guide-body.md

      - name: Publish the draft release only when every required asset is attached
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --json isDraft,tagName,assets > release-view.json
          npx --yes tsx@4.23.12 scripts/release-publish.ts release-view.json
          gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Pin the Homebrew formula checksum to the published asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          rm -rf formula-pin && mkdir -p formula-pin
          gh release download "$GITHUB_REF_NAME" --pattern "opencode-remote-${VERSION}.tar.gz" --dir formula-pin
          SHA=$(shasum -a 256 "formula-pin/opencode-remote-${VERSION}.tar.gz" | awk '{print $1}')
          URL_RE='https://github\.com/caiovicentino/opencode-remote/releases/download/v[0-9.]+/opencode-remote-v[0-9.]+\.tar\.gz'
          NEW_URL="https://github.com/caiovicentino/opencode-remote/releases/download/${VERSION}/opencode-remote-${VERSION}.tar.gz"
          sed -i -E \
            -e "s|$URL_RE|$NEW_URL|" \
            -e "s|version \"[0-9]+.[0-9]+.[0-9]+\"|version \"${VERSION#v}\"|" \
            -e 's|sha256 "[a-f0-9]{64}"|sha256 "'"${SHA}"'"|' \
            Formula/opencode-remote.rb
          git config user.name "ocr-release-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add Formula/opencode-remote.rb
          if git diff --cached --quiet; then
            echo "Formula already pinned to ${VERSION} — nothing to commit"
          else
            git commit -m "pilot(release): pin Formula checksum for ${VERSION}"
            git push origin HEAD:main || echo "::warning::could not push the Formula pin — patch it manually from this run's log"
          fi
