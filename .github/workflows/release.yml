name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # P2-130: tag and the two package.json versions must agree BEFORE anything
      # is published — a drifting version produces a latest-mac.yml whose
      # `version` field does not match the app binary, breaking electron-updater
      # for every installed copy. Fails before `gh release create`.
      - name: Release preflight (tag ↔ package.json versions)
        run: npx --yes tsx@4.23.12 scripts/release-preflight.ts "$GITHUB_REF_NAME"

      - name: Build source tarball (node_modules excluded)
        run: |
          VERSION=${GITHUB_REF_NAME}
          git archive --format=tar.gz --prefix="opencode-remote-${VERSION}/" -o "opencode-remote-${VERSION}.tar.gz" "$GITHUB_REF_NAME"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" opencode-remote-*.tar.gz --generate-notes --title "$GITHUB_REF_NAME"

      # P2-098 (round 3): the formula must never carry a checksum that was not
      # computed from the published artifact — pin url/version/sha256 to the
      # release that was just created and push to main. Direct pushes to main
      # never deploy (P2-058), so this is inert for the runtime; fail-open:
      # a refused push must not fail the release itself.
      - name: Pin the Homebrew formula checksum to the published asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          SHA=$(shasum -a 256 "opencode-remote-${VERSION}.tar.gz" | awk '{print $1}')
          URL_RE='https://github\.com/caiovicentino/opencode-remote/releases/download/v[0-9.]+/opencode-remote-v[0-9.]+\.tar\.gz'
          NEW_URL="https://github.com/caiovicentino/opencode-remote/releases/download/${VERSION}/opencode-remote-${VERSION}.tar.gz"
          sed -i -E \
            -e "s|$URL_RE|$NEW_URL|" \
            -e "s|version \"[0-9]+.[0-9]+.[0-9]+\"|version \"${VERSION#v}\"|" \
            -e 's|sha256 "[a-f0-9]{64}"|sha256 "'"${SHA}"'"|' \
            Formula/opencode-remote.rb
          git config user.name "ocr-release-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add Formula/opencode-remote.rb
          if git diff --cached --quiet; then
            echo "Formula already pinned to ${VERSION} — nothing to commit"
          else
            git commit -m "pilot(release): pin Formula checksum for ${VERSION}"
            git push origin HEAD:main || echo "::warning::could not push the Formula pin — patch it manually from this run's log"
          fi

  # P2-098: third-party installability — a release ships a real macOS installer
  # (DMG), not just the source tarball. P2-136: a signing preflight decides the
  # mode before packaging — with a usable Developer ID certificate (CSC_LINK/
  # CSC_NAME) plus the Apple notarization secrets the DMG is signed with
  # hardened runtime and notarized; without them the build stays ad-hoc signed
  # and users right-click → Open once (README), exactly as before.
  desktop-dmg:
    runs-on: macos-14
    needs: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # P2-136: pure env inspection, always exits 0 — problems are reported as
      # ::warning:: annotations and the outputs below keep the job green.
      - name: Signing preflight (Developer ID or ad-hoc)
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_IDENTITY_AUTO_DISCOVERY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node apps/desktop/scripts/signing-profile.mjs

      - name: Build + package DMG (notarized when the signing profile allows)
        env:
          # No signing identity in CI by default — ad-hoc signing
          # (right-click → Open). Discovery is only flipped on when the
          # preflight proved a usable Developer ID identity: with
          # CSC_IDENTITY_AUTO_DISCOVERY=false electron-builder skips identity
          # lookup entirely and would silently ignore the certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.mode == 'developer-id' && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          NOTARIZE=""
          if [ "${{ steps.signing.outputs.notarize }}" = "true" ]; then
            NOTARIZE="-c.mac.notarize=true"
          else
            echo "Signing profile: ${{ steps.signing.outputs.mode }} (notarize=no) — shipping ad-hoc signed DMG (skip notarization)"
          fi
          npm run dist --workspace @ocr/desktop -- $NOTARIZE

      # P2-130: a broken bundle (e.g. web-dist/index.html missing → DMG that
      # opens blank) must block the upload instead of shipping to users.
      - name: Smoke-check the packaged bundle
        run: npm run dist:smoke --workspace @ocr/desktop

      - name: Attach DMG + update metadata to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            apps/desktop/dist/*.dmg apps/desktop/dist/latest-mac.yml \
            --clobber
