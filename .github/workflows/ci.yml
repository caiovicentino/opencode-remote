name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint apps packages scripts --quiet

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx tsx scripts/unit.test.ts

      - name: Build
        run: npm run build

      - name: E2E smoke (ephemeral relay + daemon)
        run: |
          npx tsx apps/relay/src/index.ts &
          npx tsx apps/daemon/src/index.ts &
          sleep 3
          npx tsx scripts/smoke.ts

      - name: Daemon restart resilience
        run: npx tsx scripts/reconnect.test.ts

      - name: Desktop sidecar
        run: npx tsx scripts/desktop-sidecar.test.ts

      - name: Integration (real opencode)
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          npx tsx scripts/integration.ts
        env:
          OPENCODE_BIN: opencode
