name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint apps packages scripts --quiet

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: E2E smoke (ephemeral relay + daemon)
        run: |
          npx tsx apps/relay/src/index.ts &
          npx tsx apps/daemon/src/index.ts &
          sleep 3
          npx tsx scripts/smoke.ts

      - name: Daemon restart resilience
        run: npx tsx scripts/reconnect.test.ts

      - name: Desktop sidecar
        run: npx tsx scripts/desktop-sidecar.test.ts

      - name: Integration (real opencode)
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          npx tsx scripts/integration.ts
        env:
          OPENCODE_BIN: opencode

  # P2-147: scope gate for the desktop packaging job. A pure repo script
  # (no third-party action) classifies the changed paths so desktop-package
  # below only runs when the diff can actually change the bundle.
  scope:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.scope.outputs.desktop }}
      relay-image: ${{ steps.scope.outputs.relay-image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths (writes GITHUB_OUTPUT)
        id: scope
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            BASE="$(git rev-parse "${{ github.sha }}"^ 2>/dev/null || echo "${{ github.sha }}")"
          fi
          CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}" || true)"
          npx --yes tsx@4.23.12 scripts/ci-scope.ts $CHANGED

  # P2-147: catch a broken bundle in the PR itself — a missing extraResources
  # entry or a broken electron-builder target otherwise only surfaces in the
  # release job of an already-created tag (P2-130, packaging side). dir target
  # only: no DMG, no signing — the smoke check validates the real packaged
  # bundle with the installer checks skipped (--no-installer).
  desktop-package:
    runs-on: macos-14
    needs: scope
    if: needs.scope.outputs.desktop == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # P2-162: size budget over the real build output, before anything is
      # packaged — a fat dependency fails here instead of shipping as a slow
      # download. Ceilings live in scripts/bundle-budget.ts.
      - name: Bundle budget
        shell: bash
        run: npx tsx scripts/bundle-budget.ts

      - name: Package mac bundle (dir target only — no DMG, no signing)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist --workspace @ocr/desktop -- --mac --dir

      - name: Smoke-check the packaged bundle (installer checks skipped)
        run: npm run dist:smoke --workspace @ocr/desktop -- --no-installer

      # P2-242: dist-smoke only INSPECTS the bundle; a regression that only
      # shows up at runtime — main throwing at boot, an asar missing an asset
      # the renderer asks for, a blank window — used to surface only on
      # release day, where the real boot lived alone (release.yml). Boot the
      # real packaged .app here too, reusing the release boot script and its
      # hermetic contract unchanged (temp userData, run-own session, no
      # sidecar, Playwright missing fails closed). Nothing is uploaded,
      # signed, notarized or published.
      - name: Smoke-boot the packaged app
        shell: bash
        timeout-minutes: 10
        run: |
          ARCH_DIR="$(uname -m | sed 's/x86_64/x64/')"
          APP="$(find apps/desktop/dist -maxdepth 3 -type d -name '*.app' | grep -F "$ARCH_DIR" | head -1)"
          [ -n "$APP" ] || APP="$(find apps/desktop/dist -maxdepth 3 -type d -name '*.app' | head -1)"
          [ -n "$APP" ] || { echo "packaged-boot: no .app under apps/desktop/dist — nothing to boot"; exit 1; }
          echo "packaged-boot: booting $APP"
          node apps/desktop/scripts/packaged-boot.mjs "$APP"

      # P2-253: the boot smoke above deliberately never spawns the sidecar, so
      # the daemon bundle built by bundle-daemon.mjs used to reach the release
      # without ever executing in the PR. Run the same daemon smoke the
      # release workflow runs (packaged resources/daemon/index.js via the
      # package's own Electron as the Node runtime), hermetically — temp HOME,
      # relay off, ephemeral metrics port — against the same resolved bundle
      # as the boot step. Nothing is uploaded, signed or published. shell:
      # bash (P2-126 lesson) and its own timeout (P2-245 lesson).
      - name: Smoke the packaged daemon sidecar
        timeout-minutes: 5
        shell: bash
        run: |
          ARCH_DIR="$(uname -m | sed 's/x86_64/x64/')"
          APP="$(find apps/desktop/dist -maxdepth 3 -type d -name '*.app' | grep -F "$ARCH_DIR" | head -1)"
          [ -n "$APP" ] || APP="$(find apps/desktop/dist -maxdepth 3 -type d -name '*.app' | head -1)"
          [ -n "$APP" ] || { echo "packaged-daemon-smoke: no .app under apps/desktop/dist — nothing to boot"; exit 1; }
          node apps/desktop/scripts/packaged-daemon-smoke.mjs "$APP"

  # P2-219: the Windows packaging surface (nsis/win config, signing profile,
  # win-unpacked layout) was only exercised inside the release workflow, so a
  # packaging regression surfaced as a red job on publication day. This job
  # mirrors desktop-package on windows-latest: same scope indicator, dir
  # target only — never the installer, never signing, never notarization —
  # then the same deterministic bundle smoke with installer checks skipped.
  # Nothing is uploaded or published; a broken package fails the PR.
  desktop-package-win:
    runs-on: windows-latest
    needs: scope
    if: needs.scope.outputs.desktop == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # P2-126 lesson: pwsh (the windows-latest default shell) does not expand
      # globs — every run step below declares shell: bash explicitly.
      - name: Install dependencies
        shell: bash
        timeout-minutes: 15
        run: npm ci

      - name: Build
        shell: bash
        timeout-minutes: 20
        run: npm run build

      - name: Package Windows bundle (dir target only)
        shell: bash
        timeout-minutes: 30
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist --workspace @ocr/desktop -- --win --dir

      - name: Smoke-check the packaged bundle (installer checks skipped)
        shell: bash
        timeout-minutes: 10
        run: npm run dist:smoke --workspace @ocr/desktop -- --no-installer

      # P2-242: same parity for Windows — boot the real win-unpacked bundle
      # in the PR, reusing the release boot script and its hermetic contract
      # unchanged. shell: bash (P2-126/P2-164 lessons) with its own timeout;
      # nothing is uploaded, signed or published.
      - name: Smoke-boot the packaged app
        shell: bash
        timeout-minutes: 10
        run: |
          DIR="$(find apps/desktop/dist -maxdepth 2 -type d -name 'win-unpacked' | head -1)"
          [ -n "$DIR" ] || { echo "packaged-boot: no win-unpacked dir under apps/desktop/dist — nothing to boot"; exit 1; }
          echo "packaged-boot: booting $DIR"
          node apps/desktop/scripts/packaged-boot.mjs "$DIR"

      # P2-253: same daemon-sidecar smoke the release win job runs — the
      # packaged resources/daemon/index.js boots via the package's own
      # Electron as the Node runtime, hermetically (temp HOME, relay off,
      # ephemeral metrics port), against the same resolved win-unpacked
      # bundle as the boot step. Nothing is uploaded or published. shell:
      # bash (P2-126 lesson) and its own timeout (P2-245 lesson).
      - name: Smoke the packaged daemon sidecar
        timeout-minutes: 5
        shell: bash
        run: |
          DIR="$(find apps/desktop/dist -maxdepth 2 -type d -name 'win-unpacked' | head -1)"
          [ -n "$DIR" ] || { echo "packaged-daemon-smoke: no win-unpacked dir under apps/desktop/dist — nothing to boot"; exit 1; }
          node apps/desktop/scripts/packaged-daemon-smoke.mjs "$DIR"

  # P2-224: the unit battery only ever ran on ubuntu-latest, so the Windows
  # half of the path logic (relay webroot, installloc, loginitem, desktop-log,
  # tray logsDirPath, sidecar-log, ci-scope, versions) was exercised solely
  # against the POSIX separator and a regression surfaced on the machine of a
  # non-technical user, after the signed installer shipped. This job runs the
  # typecheck plus the portable, Windows-safe subset of the unit battery
  # (scripts/portable-suite.ts) on windows-latest for every PR touching the
  # desktop surface — same scope indicator as the packaging jobs above.
  #
  # PUBLISHING PROHIBITION (deliberate): this job does NOT log in to any
  # registry, does NOT use any third-party login/push action, does NOT
  # publish anything, does NOT attach artifacts and does NOT read any
  # secret — a pure verification job, publication stays with release.yml.
  verify-win:
    runs-on: windows-latest
    needs: scope
    if: needs.scope.outputs.desktop == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # P2-126/P2-164 lessons: pwsh (the windows-latest default shell) does
      # not expand globs and can break a run silently — every step below
      # declares shell: bash explicitly, heavy steps carry their own timeout
      # so a hung runner cannot hold the CI queue.
      - name: Install dependencies
        shell: bash
        timeout-minutes: 15
        run: npm ci

      - name: Typecheck
        shell: bash
        timeout-minutes: 20
        run: npm run typecheck

      - name: Portable unit tests (Windows-safe subset)
        shell: bash
        timeout-minutes: 20
        run: npm run test:unit-win

  # P2-222: the relay image surface (deploy/relay/Dockerfile, the embedded
  # bundle dir the P2-188 stage serves, the boot preflight, the non-root
  # container user) was only exercised by the relay-image job of release.yml —
  # a Dockerfile regression arrived as a red job on tag day, with the release
  # already drafted (the exact cost P2-219 removed for the Windows packaging).
  # This PR-scoped job mirrors that gate on every PR touching the relay
  # surface: same build, same ephemeral loopback port, same 30×1s /healthz
  # wait ceiling and the same scripts/relay-image-smoke.ts battery, so an
  # image that compiles but does not boot fails the pull request.
  #
  # PUBLISHING PROHIBITION (deliberate): this job does NOT log in to any
  # registry, does NOT use any third-party login/push action, does NOT push
  # or publish the image, does NOT attach artifacts and does NOT read any
  # secret — building on a PR must never become an accidental publishing
  # path. Publication stays exclusively with the release workflow.
  relay-image:
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.relay-image == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Build image (ephemeral local tag only — never a registry ref)
        shell: bash
        timeout-minutes: 15
        run: |
          docker build -f deploy/relay/Dockerfile -t relay-smoke:pr .

      # Same shape as the release relay-image smoke (P2-196): boot on an
      # ephemeral loopback port, wait at most 30 attempts × 1s for /healthz,
      # run the probe battery, remove the container no matter how the step
      # ends. shell: bash (P2-126/P2-164 lessons).
      - name: Boot the built image and smoke it (same battery as release)
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          PORT=$(( (RANDOM % 20000) + 30000 ))
          docker run -d --name relay-smoke \
            -p "127.0.0.1:${PORT}:8787" \
            relay-smoke:pr
          trap 'docker rm -f relay-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORT}/healthz" >/dev/null 2>&1; then
              break
            fi
            if [ "$i" = 30 ]; then
              echo "relay-image-smoke: /healthz never answered after 30 attempts — the image does not boot"
              docker logs relay-smoke
              exit 1
            fi
            sleep 1
          done
          CONTAINER_USER="$(docker exec relay-smoke whoami)"
          npx --yes tsx@4.23.12 scripts/relay-image-smoke.ts "http://127.0.0.1:${PORT}" "$CONTAINER_USER"
