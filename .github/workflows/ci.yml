name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint apps packages scripts --quiet

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: E2E smoke (ephemeral relay + daemon)
        run: |
          npx tsx apps/relay/src/index.ts &
          npx tsx apps/daemon/src/index.ts &
          sleep 3
          npx tsx scripts/smoke.ts

      - name: Daemon restart resilience
        run: npx tsx scripts/reconnect.test.ts

      - name: Desktop sidecar
        run: npx tsx scripts/desktop-sidecar.test.ts

      - name: Integration (real opencode)
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          npx tsx scripts/integration.ts
        env:
          OPENCODE_BIN: opencode

  # P2-147: scope gate for the desktop packaging job. A pure repo script
  # (no third-party action) classifies the changed paths so desktop-package
  # below only runs when the diff can actually change the bundle.
  scope:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.scope.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths (writes GITHUB_OUTPUT)
        id: scope
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            BASE="$(git rev-parse "${{ github.sha }}"^ 2>/dev/null || echo "${{ github.sha }}")"
          fi
          CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}" || true)"
          npx --yes tsx@4.23.12 scripts/ci-scope.ts $CHANGED

  # P2-147: catch a broken bundle in the PR itself — a missing extraResources
  # entry or a broken electron-builder target otherwise only surfaces in the
  # release job of an already-created tag (P2-130, packaging side). dir target
  # only: no DMG, no signing — the smoke check validates the real packaged
  # bundle with the installer checks skipped (--no-installer).
  desktop-package:
    runs-on: macos-14
    needs: scope
    if: needs.scope.outputs.desktop == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # P2-162: size budget over the real build output, before anything is
      # packaged — a fat dependency fails here instead of shipping as a slow
      # download. Ceilings live in scripts/bundle-budget.ts.
      - name: Bundle budget
        shell: bash
        run: npx tsx scripts/bundle-budget.ts

      - name: Package mac bundle (dir target only — no DMG, no signing)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist --workspace @ocr/desktop -- --mac --dir

      - name: Smoke-check the packaged bundle (installer checks skipped)
        run: npm run dist:smoke --workspace @ocr/desktop -- --no-installer

  # P2-219: the Windows packaging surface (nsis/win config, signing profile,
  # win-unpacked layout) was only exercised inside the release workflow, so a
  # packaging regression surfaced as a red job on publication day. This job
  # mirrors desktop-package on windows-latest: same scope indicator, dir
  # target only — never the installer, never signing, never notarization —
  # then the same deterministic bundle smoke with installer checks skipped.
  # Nothing is uploaded or published; a broken package fails the PR.
  desktop-package-win:
    runs-on: windows-latest
    needs: scope
    if: needs.scope.outputs.desktop == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # P2-126 lesson: pwsh (the windows-latest default shell) does not expand
      # globs — every run step below declares shell: bash explicitly.
      - name: Install dependencies
        shell: bash
        timeout-minutes: 15
        run: npm ci

      - name: Build
        shell: bash
        timeout-minutes: 20
        run: npm run build

      - name: Package Windows bundle (dir target only)
        shell: bash
        timeout-minutes: 30
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist --workspace @ocr/desktop -- --win --dir

      - name: Smoke-check the packaged bundle (installer checks skipped)
        shell: bash
        timeout-minutes: 10
        run: npm run dist:smoke --workspace @ocr/desktop -- --no-installer
