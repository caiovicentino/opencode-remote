# electron-builder config for @ocr/desktop.
# Packaging (DMG/notarization) is stage 5 of docs/VISION.md — this scaffold
# only guarantees a working `--dir` build of the current shell.
appId: com.culturabuilder.opencode-remote
productName: OpenCode Remote
# P3-014: declare the opencode-remote:// scheme in the packaged bundle
# (CFBundleURLTypes on macOS, registry on Windows) so the installer knows the
# app handles it; main.ts binds the handler at runtime via
# setAsDefaultProtocolClient (packaged builds only).
protocols:
  - name: "OpenCode Remote Pairing"
    schemes:
      - opencode-remote
files:
  - dist-electron/**
  - package.json
  # P3-009: real app icon (scripts/make-icon.mjs) — shipped inside the asar so
  # BrowserWindow/app.dock.setIcon can resolve it at runtime (appIcon()).
  - build/icon.png
  # P3-015: tray template image (monochrome glyph, adapts to light/dark menu
  # bar) + its 2x Retina variant — nativeImage.createFromPath picks the @2x
  # sibling up automatically. Same asar-relative path appIcon() relies on.
  - build/trayTemplate.png
  - build/trayTemplate@2x.png
  # P2-136: hardened-runtime entitlements (mac.entitlements points here) ride
  # along in the bundle so the shipped app documents its own signing surface.
  - build/entitlements.mac.plist
extraResources:
  # Bundle the web UI so the packaged app can load it from resources/web-dist
  - from: ../web/dist
    to: web-dist
    filter:
      - "**/*"
  # Daemon sidecar bundle (apps/desktop/scripts/bundle-daemon.mjs →
  # dist-daemon/index.js), shipped where resolveEntry() looks for it.
  # dashboard.html rides along: the CJS bundle has no import.meta, so the
  # /dashboard route resolves it via __dirname (dashboardFile() in the daemon).
  - from: dist-daemon
    to: daemon
    filter:
      - "index.js"
      - "dashboard.html"
mac:
  # P1-050: client-ready packaging. `dmg` produces the distributable
  # OpenCode Remote-<version>.dmg; `dir` keeps a plain .app around for the
  # deterministic smoke check (npm run dist:smoke --workspace @ocr/desktop).
  # P2-136: hardened runtime + entitlements are always declared (they are
  # mandatory for Developer ID signing/notarization and inert for ad-hoc
  # signing). Without signing credentials the build stays ad-hoc signed; the
  # user-visible effect is a standard Gatekeeper "unidentified developer"
  # right-click → Open on first launch, documented in README/troubleshooting.
  # Release notarization is decided by scripts/signing-profile.mjs, which the
  # release workflow runs before packaging.
  target:
    - target: dmg
    - target: dir
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  # Craft: branded installer window, no license/EULA noise.
  title: OpenCode Remote ${version}
  window:
    width: 560
    height: 340
  contents:
    # P2-098: omit `path` (electron-builder 26 then sources the built .app via
    # its absolute appPath — the old relative "*.app" glob breaks with the
    # dmgbuild bundled since dmg-builder@1.2.5, FileNotFoundError at dmg time)
    - x: 144
      y: 200
      type: file
      name: "OpenCode Remote.app"
    - x: 416
      y: 200
      type: link
      path: /Applications
win:
  # P2-126: `nsis` produces the real Windows installer third parties install
  # (assisted setup, per-user, choosable install dir — same story as the mac
  # dmg above); `dir` keeps the plain win-unpacked bundle around for the
  # deterministic smoke check. Unsigned until CSC_LINK/CSC_KEY_PASSWORD are
  # configured: SmartScreen shows a one-time warning (README).
  target:
    - target: nsis
    - target: dir
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Deterministic, version-templated file name — the release workflow glob-
  # uploads it and dist-smoke's findWindowsInstaller() keys off the dist root.
  artifactName: OpenCode Remote Setup ${version}.exe
linux:
  target: dir
  icon: build/icon.png
