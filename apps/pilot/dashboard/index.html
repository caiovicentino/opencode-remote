<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pilot — Mission Control</title>
<style>
  :root { --cyan:#22d3ee; --green:#4ade80; --red:#f87171; --gold:#fbbf24; --bg:#04060a; --text:#e8edf2; --muted:#8fa3b8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:var(--bg); font-family:-apple-system,'SF Pro Text',system-ui,sans-serif; color:var(--text); }
  #scene { position:fixed; inset:0; }
  .overlay { position:fixed; z-index:10; pointer-events:none; }
  #header { top:0; left:0; right:0; padding:18px 24px; display:flex; align-items:center; gap:14px;
            background:linear-gradient(to bottom, rgba(4,6,10,.88), transparent); }
  #header h1 { font-size:15px; letter-spacing:.22em; text-transform:uppercase; font-weight:700;
               background:linear-gradient(90deg,#22d3ee,#4ade80,#fbbf24); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #header .sub { font-size:11px; color:var(--muted); letter-spacing:.08em; }
  #progress { display:inline-block; width:120px; height:4px; border-radius:2px; background:rgba(34,211,238,.15);
              vertical-align:middle; margin-right:10px; overflow:hidden; }
  #progress i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--cyan),var(--green));
                border-radius:2px; transition:width .6s ease; box-shadow:0 0 8px rgba(34,211,238,.6); }
  #live { width:10px; height:10px; border-radius:50%; background:#555; }
  #live.on { background:var(--green); animation:pulse 1.6s infinite; }
  #live.stale { background:var(--red); animation:none; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)} 70%{box-shadow:0 0 0 12px rgba(74,222,128,0)} 100%{box-shadow:0 0 0 0 rgba(74,222,128,0)} }
  #stats { top:70px; right:20px; width:230px; background:rgba(10,16,24,.72); border:1px solid rgba(34,211,238,.18);
           border-radius:14px; padding:14px 16px; backdrop-filter:blur(8px); }
  #stats .row { display:flex; justify-content:space-between; font-size:12px; padding:4px 0; color:#c9d6e3; }
  #stats .row b { font-variant-numeric:tabular-nums; }
  #stats .row b.ok { color:var(--green); } #stats .row b.bad { color:var(--red); }
  #task { bottom:86px; left:50%; transform:translateX(-50%); max-width:80vw; text-align:center;
          background:rgba(10,16,24,.72); border:1px solid rgba(34,211,238,.25); border-radius:999px;
          padding:10px 22px; font-size:13px; backdrop-filter:blur(8px); }
  #task .phase { color:var(--cyan); font-weight:700; margin-right:8px; text-transform:uppercase; font-size:11px; letter-spacing:.14em; }
  #ticker { bottom:0; left:0; right:0; padding:10px 24px 14px; font:11px/1.7 ui-monospace,Menlo,monospace;
            color:#7d90a5; background:linear-gradient(to top, rgba(4,6,10,.92), transparent); height:112px; overflow:hidden; }
  #ticker div { white-space:nowrap; text-overflow:ellipsis; overflow:hidden; }
  #ticker .t { color:var(--cyan); } #ticker .ok { color:var(--green); } #ticker .bad { color:var(--red); } #ticker .gold { color:var(--gold); }
  #tokenbox { top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:auto; background:rgba(10,16,24,.92);
              border:1px solid rgba(34,211,238,.3); border-radius:16px; padding:24px; width:340px; display:none; }
  #tokenbox h3 { font-size:13px; margin-bottom:10px; letter-spacing:.08em; }
  #tokenbox input { width:100%; padding:9px 12px; background:#0b111a; border:1px solid #2a3947; color:var(--text); border-radius:8px; font-size:12px; }
  #tokenbox button { margin-top:10px; width:100%; padding:9px; background:var(--cyan); border:none; color:#04121a; font-weight:700; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="overlay" id="header">
  <div id="live"></div>
  <div>
    <h1>Pilot · Mission Control</h1>
    <div class="sub">opencode-remote — autonomous workflow, live</div>
  </div>
</div>

<div class="overlay" id="stats">
  <div class="row"><span>TASKS HOJE</span><b id="s-tasks">0</b></div>
  <div class="row"><span>DEPLOYS</span><b id="s-deploys" class="ok">0</b></div>
  <div class="row"><span>FALHAS</span><b id="s-fails" class="bad">0</b></div>
  <div class="row"><span>MERGES</span><b id="s-prs">0</b></div>
  <div class="row"><span>HEARTBEAT</span><b id="s-hb">—</b></div>
</div>

<div class="overlay" id="task"><span id="progress"><i></i></span><span class="phase" id="task-phase">IDLE</span><span id="task-title">aguardando backlog…</span></div>
<div class="overlay" id="ticker"></div>

<div class="overlay" id="tokenbox">
  <h3>API TOKEN (daemon.json → apiToken)</h3>
  <input id="token" placeholder="cole o apiToken" />
  <button onclick="saveToken()">Conectar</button>
</div>

<script>
// ─── canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = Math.min(devicePixelRatio || 1, 2);
function resize() {
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}
addEventListener("resize", resize);

// ─── pipeline layout (2D) ─────────────────────────────────────────────────────
const NODES = [
  { id:"backlog",    label:"BACKLOG",    fx:0.09, fy:0.50, color:"#8fa3b8" },
  { id:"builder",    label:"BUILDER",    fx:0.24, fy:0.50, color:"#22d3ee" },
  { id:"security",   label:"SEC REVIEW", fx:0.40, fy:0.34, color:"#818cf8" },
  { id:"quality",    label:"QUALITY",    fx:0.40, fy:0.66, color:"#38bdf8" },
  { id:"gatekeeper", label:"GATEKEEPER", fx:0.56, fy:0.50, color:"#fbbf24" },
  { id:"deploy",     label:"DEPLOY",     fx:0.72, fy:0.50, color:"#4ade80" },
  { id:"core",       label:"MAC · PROD", fx:0.88, fy:0.50, color:"#e8edf2", big:true },
];
const nodeMap = {};
function layout() {
  for (const n of NODES) {
    n.x = n.fx * W; n.y = n.fy * H; n.r = n.big ? 34 : 26;
    nodeMap[n.id] = n;
  }
}

// visual state per node: idle | working | ok | fail
const states = {};
function setState(id, s) { if (nodeMap[id]) states[id] = s; }
function resetStates() { for (const n of NODES) states[n.id] = "idle"; }

// particles flowing between nodes
const particles = []; // {from,to,color,t,speed}
function flow(from, to, color, count = 14) {
  const f = nodeMap[from], t = nodeMap[to]; if (!f || !t) return;
  for (let i = 0; i < count; i++) {
    particles.push({ fx:f.x, fy:f.y, tx:t.x, ty:t.y, color, t:-i*0.06, speed:0.008 + Math.random()*0.006, mid:(Math.random()-.5)*60 });
  }
}
// burst (merge / rollback celebration)
const bursts = []; // {x,y,color,t,parts:[{a,v}]}
function burst(x, y, color) {
  const parts = [];
  for (let i = 0; i < 36; i++) parts.push({ a: Math.random()*Math.PI*2, v: 1.5 + Math.random()*3 });
  bursts.push({ x, y, color, t: 0, parts });
}

// ─── drawing ──────────────────────────────────────────────────────────────────
function draw(time) {
  ctx.clearRect(0, 0, W, H);
  // background vignette
  const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
  bg.addColorStop(0, "#071019"); bg.addColorStop(1, "#04060a");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // animated diagonal grid (parallax waves)
  ctx.save();
  ctx.lineWidth = 1;
  const drift = (time * 12) % 46;
  for (let gx = -46 + drift; gx < W + 46; gx += 46) {
    ctx.strokeStyle = "rgba(34,211,238,.045)";
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx + 60, H); ctx.stroke();
  }
  for (let gy = -46 + (time * 8) % 46; gy < H + 46; gy += 46) {
    ctx.strokeStyle = "rgba(34,211,238,.035)";
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  }
  // slow sine wave across the middle
  ctx.beginPath();
  for (let x = 0; x <= W; x += 8) {
    const y = H/2 + Math.sin(x*0.008 + time*0.9) * 26 * Math.sin(time*0.23);
    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = "rgba(34,211,238,.06)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
  // dotted grid
  ctx.fillStyle = "rgba(56,130,160,.07)";
  for (let gx = 20; gx < W; gx += 46) for (let gy = 20; gy < H; gy += 46) ctx.fillRect(gx, gy, 2, 2);

  // connection rails
  ctx.lineWidth = 1;
  for (const [a, b] of [["backlog","builder"],["builder","security"],["builder","quality"],["security","gatekeeper"],["quality","gatekeeper"],["gatekeeper","deploy"],["deploy","core"]]) {
    const f = nodeMap[a], t = nodeMap[b];
    ctx.strokeStyle = "rgba(34,211,238,.10)";
    ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(t.x, t.y); ctx.stroke();
  }

  // particles
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.t += p.speed;
    if (p.t > 1) { particles.splice(i, 1); continue; }
    if (p.t < 0) continue;
    const mx = (p.fx+p.tx)/2, my = (p.fy+p.ty)/2 + p.mid;
    const u = p.t, iu = 1-u;
    const x = iu*iu*p.fx + 2*iu*u*mx + u*u*p.tx;
    const y = iu*iu*p.fy + 2*iu*u*my + u*u*p.ty;
    const alpha = Math.sin(u * Math.PI);
    ctx.beginPath(); ctx.arc(x, y, 2.4, 0, Math.PI*2);
    ctx.fillStyle = hexA(p.color, alpha * 0.95);
    ctx.shadowColor = p.color; ctx.shadowBlur = 12;
    ctx.fill(); ctx.shadowBlur = 0;
  }

  // nodes
  for (const n of NODES) {
    const st = states[n.id] || "idle";
    const working = st === "working";
    const pulse = working ? 1 + Math.sin(time*5)*0.10 : 1;
    const r = n.r * pulse;
    // glow
    const glowColor = st === "fail" ? "#f87171" : st === "ok" ? "#4ade80" : working ? "#22d3ee" : n.color;
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r*3);
    g.addColorStop(0, hexA(glowColor, working ? .5 : .22));
    g.addColorStop(1, hexA(glowColor, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(n.x, n.y, r*3, 0, Math.PI*2); ctx.fill();
    // body with radial gradient (3D-ish sphere feel)
    const bodyG = ctx.createRadialGradient(n.x - r*0.3, n.y - r*0.35, r*0.1, n.x, n.y, r);
    bodyG.addColorStop(0, "#12202e"); bodyG.addColorStop(1, "#0a1420");
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI*2);
    ctx.fillStyle = bodyG; ctx.fill();
    ctx.lineWidth = 2.2; ctx.strokeStyle = hexA(glowColor, working ? 1 : .55); ctx.stroke();
    // icon glyph
    const glyphs = { backlog:"☰", builder:"B", security:"S", quality:"Q", gatekeeper:"⛑", deploy:"➤", core:"⊙" };
    ctx.font = `700 ${r*0.9}px -apple-system,system-ui,sans-serif`;
    ctx.fillStyle = hexA(glowColor, .9);
    ctx.fillText(glyphs[n.id] || "●", n.x, n.y + 1);
    // ring
    ctx.beginPath(); ctx.arc(n.x, n.y, r + 7, time * (working ? 2.2 : 0.6), time * (working ? 2.2 : 0.6) + Math.PI*1.4);
    ctx.strokeStyle = hexA(glowColor, .5); ctx.lineWidth = 1.4; ctx.stroke();
    // label
    ctx.font = "700 12px -apple-system,system-ui,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = hexA(glowColor, .95);
    ctx.fillText(n.label, n.x, n.y - r - 16);
    // status dot
    ctx.beginPath(); ctx.arc(n.x + r*0.75, n.y - r*0.75, 4, 0, Math.PI*2);
    ctx.fillStyle = hexA(glowColor, 1); ctx.fill();
  }

  // bursts
  for (let i = bursts.length-1; i >= 0; i--) {
    const b = bursts[i]; b.t += 0.02;
    if (b.t > 1) { bursts.splice(i, 1); continue; }
    for (const p of b.parts) {
      const d = b.t * p.v * 40, x = b.x + Math.cos(p.a)*d, y = b.y + Math.sin(p.a)*d;
      ctx.beginPath(); ctx.arc(x, y, 2.6*(1-b.t), 0, Math.PI*2);
      ctx.fillStyle = hexA(b.color, (1-b.t)*0.9); ctx.fill();
    }
    // shockwave ring
    ctx.beginPath(); ctx.arc(b.x, b.y, b.t*120, 0, Math.PI*2);
    ctx.strokeStyle = hexA(b.color, (1-b.t)*0.5); ctx.lineWidth = 2; ctx.stroke();
  }
}
function hexA(hex, a) {
  const c = hex.replace("#","");
  const r = parseInt(c.slice(0,2),16), g = parseInt(c.slice(2,4),16), b = parseInt(c.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

let last = 0;
function loop(time) {
  const dt = Math.min((time - last)/1000, 0.1); last = time;
  draw(time/1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ─── polling ──────────────────────────────────────────────────────────────────
let token = localStorage.getItem("ocr_dash_token");
const params = new URLSearchParams(location.search);
if (params.get("token")) { token = params.get("token"); localStorage.setItem("ocr_dash_token", token); history.replaceState(null,"","/dashboard"); }
if (token) startPolling(); else document.getElementById("tokenbox").style.display = "block";
function saveToken() {
  token = document.getElementById("token").value.trim();
  localStorage.setItem("ocr_dash_token", token);
  document.getElementById("tokenbox").style.display = "none";
  startPolling();
}
window.saveToken = saveToken;

async function poll() {
  try {
    const res = await fetch("/api/pilot-events", { headers: { authorization: `Bearer ${token}` } });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const hb = data.heartbeatMs ?? Infinity;
    document.getElementById("live").className = hb < 90_000 ? "on" : "stale";
    document.getElementById("s-hb").textContent = hb === Infinity ? "—" : `${Math.round(hb/1000)}s`;
    document.getElementById("s-tasks").textContent = data.state?.tasks ?? 0;
    document.getElementById("s-deploys").textContent = data.state?.deploys ?? 0;
    document.getElementById("s-fails").textContent = data.state?.failures ?? 0;
    render(data.events || []);
  } catch {
    document.getElementById("live").className = "stale";
  }
}
function startPolling() { poll(); setInterval(poll, 2000); }

function render(events) {
  resetStates();
  const ticker = document.getElementById("ticker");
  ticker.innerHTML = "";
  for (const e of events.slice(-120)) {
    const time = (e.ts || "").slice(11, 19);
    const div = document.createElement("div");
    const cls = e.type === "result" ? (e.ok ? "ok" : "bad") : e.type === "deploy" ? (e.ok === false ? "bad" : "gold") : "t";
    div.innerHTML = `<span class="${cls}">${time}</span> [${(e.task || e.type).slice(0, 10)}] ${e.phase || e.type} ${escapeHtml(e.detail || "").slice(0, 110)}`;
    ticker.appendChild(div);
  }
  while (ticker.children.length > 6) ticker.removeChild(ticker.firstChild);

  // last phase per task
  const last = {};
  for (const e of events.filter(x => x.type === "phase")) if (e.task) last[e.task] = e;
  const tasks = Object.keys(last);
  const cur = tasks[tasks.length - 1];
  if (cur) {
    const e = last[cur];
    const seq = ["builder","builder-done","reviewers","reviewers-done","gatekeeper","merge"];
    const idx = seq.indexOf(e.phase);
    const phaseEl = document.getElementById("task-phase");
    phaseEl.textContent = (e.phase || "").toUpperCase();
    phaseEl.style.color = e.ok === false ? "var(--red)" : "var(--cyan)";
    document.getElementById("task-title").textContent = `(${cur}) — ${e.detail || ""}`;
    const bar = document.querySelector("#progress i");
    if (bar) bar.style.width = `${Math.min((idx + 1) / 6, 1) * 100}%`;

    if (idx >= 0) {
      const order = ["backlog","builder","security","quality","gatekeeper","deploy"];
      for (let i = 0; i < order.length; i++) setState(order[i], i <= Math.min(idx, 5) ? "ok" : "idle");
      setState("builder", e.phase === "builder" ? "working" : idx > 0 ? "ok" : "idle");
      if (e.phase === "reviewers") { setState("security","working"); setState("quality","working"); }
      if (e.phase === "reviewers-done") { setState("security", e.ok ? "ok" : "fail"); setState("quality", e.ok ? "ok" : "fail"); }
      if (e.phase === "gatekeeper") setState("gatekeeper","working");
      if (e.phase === "merge") setState("gatekeeper", e.ok ? "ok" : "fail");
      if (e.phase === "merge" && e.ok) {
        setState("deploy","working");
        flow("gatekeeper","deploy","#fbbf24");
        burst(nodeMap.gatekeeper.x, nodeMap.gatekeeper.y, "#fbbf24");
      }
      if (e.phase !== "builder") flow("backlog","builder","#22d3ee");
      if (idx >= 2) { flow("builder","security","#818cf8"); flow("builder","quality","#38bdf8"); }
      if (e.phase === "builder") flow("backlog","builder","#22d3ee");
    }
  }

  // deploy events → core
  const dep = [...events].reverse().find(e => e.type === "deploy");
  if (dep) {
    setState("core", dep.phase === "done" ? "ok" : dep.phase === "rollback" ? "fail" : "working");
    if (dep.phase === "start") flow("deploy","core","#4ade80");
    if (dep.phase === "rollback") { setState("deploy","fail"); burst(nodeMap.core.x, nodeMap.core.y, "#f87171"); }
    if (dep.phase === "done") burst(nodeMap.core.x, nodeMap.core.y, "#4ade80");
  }
  document.getElementById("s-prs").textContent = events.filter(e => e.phase === "merge" && e.ok).length;
}
function escapeHtml(s) { return s.replace(/</g, "&lt;"); }

resize();
</script>
</body>
</html>
